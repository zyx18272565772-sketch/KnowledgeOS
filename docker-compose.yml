services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledgeos-app
    restart: unless-stopped
    env_file:
      - python-service/.env
    environment:
      # 覆盖本地 .env 中不适用于容器的值（Compose 中 environment 优先级高于 env_file）
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ai_knowledge_db}"
      MYSQL_USERNAME: "root"
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:-ai_knowledge_root}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      TESSERACT_PATH: "/usr/bin/tesseract"
      # 全新数据库需要显式给出初始账号，否则库里没有任何用户，无法登录
      DEFAULT_ADMIN_USERNAME: "${DEFAULT_ADMIN_USERNAME:-admin}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-admin123}"
      DEFAULT_DEMO_USERNAME: "${DEFAULT_DEMO_USERNAME:-agent}"
      DEFAULT_DEMO_PASSWORD: "${DEFAULT_DEMO_PASSWORD:-123456}"
    ports:
      # 宿主机 8000 已被其他项目容器占用，这里默认映射到 8001；
      # 需要改回 8000 时设置环境变量 APP_PORT=8000 即可。容器内始终监听 8000。
      - "${APP_PORT:-8001}:8000"
    volumes:
      - faiss_index:/app/python-service/faiss_index
      - pending_vectors:/app/python-service/pending_vectors
      - uploads:/app/python-service/uploads
      - app_temp:/app/python-service/temp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: knowledgeos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-ai_knowledge_root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ai_knowledge_db}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-ai_knowledge_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: knowledgeos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  faiss_index:
  pending_vectors:
  uploads:
  app_temp: